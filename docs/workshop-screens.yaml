    margin: 16

  - name: 50-platform-config-storage
    chapter: 10-prepare/50-platform-config
    status: new   # workshop-files S3 Files, allowed for retail-service
    account: admin
    path: /v3/storage
    wait: '[data-testid=v3-storage-access] select'
    actions:
      - {eval: "(() => { const s = document.querySelector('[data-testid=v3-storage-access] select'); Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set.call(s,'retail-service'); s.dispatchEvent(new Event('change',{bubbles:true})); })()"}
      - {sleep: 1500}
    clip: main.v3-main div.v3-reveal
    highlights:
      - {n: 1, box: 'tr:has(td:has-text("S3 Files"))', badge: left}
      - {n: 2, box: '[data-testid=v3-storage-access]', badge: left}

