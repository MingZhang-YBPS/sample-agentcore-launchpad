    path: /v3/network
    wait: '[data-testid=v3-network-access] select'
    actions:
      - {eval: "(() => { const s = document.querySelector('[data-testid=v3-network-access] select'); Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set.call(s,'retail-service'); s.dispatchEvent(new Event('change',{bubbles:true})); })()"}
      - {sleep: 1500}
    clip: '[data-testid=v3-network-access]'
    margin: 48
    highlights:
      - {n: 1, box: '[data-testid=v3-network-access] select', badge: left}
      - {n: 2, box: '[data-testid=v3-network-access] tr:has-text("workshop-private")', badge: left}
      - {n: 3, box: '[data-testid=v3-network-access] button.v3-btn.primary', badge: right}

  - name: 50-platform-config-enforcement
