    wait: 'td:has-text("biz-owner")'
    actions:
      - {click: {zh: 'tr:has(td:has-text("biz-owner")) button:has-text("编辑")', en: 'tr:has(td:has-text("biz-owner")) button:has-text("Edit")'}}
