# Agent-DLC workshop screenshots — one entry per image base name.
# Read by backend/scripts/capture_workshop_screens.py (format in its docstring).
#
# Fields: name · chapter (content file) · status (keep | replace | new) · account
# (admin | developer | biz-owner | release-ops | sme | anon) · path · wait · actions ·
# clip (Playwright selector(s); the crop is their union plus `margin`) · highlights
# ([{n, box}] — the numbers match the "图中：" caption; no n = an unnumbered frame) ·
# hide / mask (selectors hidden / blurred) · storage (localStorage overrides on top
# of: dark theme, the shot's language, V3, tour seen, chooser skipped) · viewport ·
# requires (agent:NAME, user:NAME, fact:<agent>.<story fact>[=value], state:<what a
# workshop walk-through must have produced>) · manual (why it is not captured).
# Any string may be a {zh: ..., en: ...} pair; {agent:NAME} / {user:NAME} expand to ids.

shots:
  # ── 10-prepare/20-setup ────────────────────────────────────────────────────
  - name: 10-setup-signin
    chapter: 10-prepare/20-setup
    status: keep
    account: anon
    path: /v3
    wait: '[data-testid=auth-tabs]'
    highlights:
      - {n: 1, box: '[data-testid=auth-tab-signin]', badge: left}
      - {n: 2, box: '.v3-auth-fields .v3-field >> nth=0', badge: left}
      - {n: 3, box: '.v3-auth-fields .v3-field >> nth=1', badge: left}
      - {n: 4, box: '.v3-auth-submit', badge: left}

  - name: 10-setup-v3-topbar
    chapter: 10-prepare/20-setup
    status: replace   # the top bar gained the theme switch
    account: admin
    path: /v3
    wait: '[data-testid=v3-shell]'
    clip: header.v3-top
    margin: 6
    highlights:
      - {n: 1, box: .v3-cmdk-trigger}
      - {n: 2, box: 'label.v3-ws >> nth=0'}
      - {n: 3, box: '.v3-top-right > button.v3-btn.ghost.sm >> nth=0'}
      - {n: 4, box: '[data-testid=v3-theme-switch]'}
      - {n: 5, box: '.v3-top-right > .v3-help:not(.v3-theme)'}
      - {n: 6, box: '[data-testid=v3-switch-v2]'}
      - {n: 7, box: ['.v3-account', '.v3-top-right > button >> nth=-1']}

  - name: 10-setup-v3-onboarding
    chapter: 10-prepare/20-setup
    status: keep
    account: admin
    path: /v3
    storage: {launchpad_v3_tour_done: null}
    wait: .v3-tour-card
    requires: ['state:fresh workspace (launch sequence at 1/5, no agents)']
    highlights:
      - {box: .v3-tour-card}

  - name: 10-setup-v3-rail
    chapter: 10-prepare/20-setup
    status: replace   # the Configure group grew from 6 to 17 entries
    account: admin
    path: /v3
    viewport: [1440, 1400]
    storage: {launchpad_nav_mode: expert}
    wait: '[data-testid=v3-shell]'
    actions: [{expand_rail: true}]
    clip: nav.v3-rail
    margin: 0
    highlights:
      - {box: ['[data-tour=modules] .v3-rail-label', '[data-tour=modules] .v3-rail-group']}
      - {n: 1, box: '[data-testid=v3-nav-mode]'}

  - name: 10-setup-service-health
    chapter: 10-prepare/20-setup
    status: keep
    account: admin
    path: /v2?full=1
    wait: ul.v2-home-health
    clip: 'div:has(> ul.v2-home-health)'
    margin: 8
    highlights:
      - {box: ['[data-testid=v2-health-gateway]', '[data-testid=v2-health-memory]',
               '[data-testid=v2-health-registry]', '[data-testid=v2-health-observability]']}

  - name: 10-concepts-glossary
    chapter: 10-prepare/10-concepts
    status: new   # the console's own glossary: platform terms + Agent-DLC term cards
    account: admin
    path: /v3
    wait: '[data-testid=v3-shell]'
    actions:
      - {click: '.v3-top-right > .v3-help:not(.v3-theme) > button'}
      - {click: {zh: '.v3-help-menu >> text=术语表', en: '.v3-help-menu >> text=Glossary'}}
      - {wait: .v3-dlc-terms}
    clip: '[role=dialog]'
    margin: 44   # room for the left badges outside the dialog
    highlights:
      - {n: 1, box: '[role=dialog] input.v3-input', badge: left}
      - {n: 2, box: '.v3-dlc-term >> nth=0'}
      - {n: 3, box: '.v3-dlc-term >> nth=0 >> .v3-dlc-term-used', badge: left}

  # ── 10-prepare/30-roles ────────────────────────────────────────────────────
  # Taking this shot IS the walk-through's self-registration: one trainee per
  # language (re-running fails at the wait, the name being taken).
  - name: 15-roles-register-pending
    chapter: 10-prepare/30-roles
    status: keep
    account: anon
    path: /v3
    wait: '[data-testid=auth-tabs]'
    actions:
      - {click: '[data-testid=auth-tab-register]'}
      - {fill: {zh: ['#reg-username', trainee-xiaoming], en: ['#reg-username', trainee-alex]}}
      - {fill: {zh: ['#reg-email', trainee-xiaoming@example.com], en: ['#reg-email', trainee-alex@example.com]}}
      - {fill: ['#reg-password', '{env:LP_TRAINEE_PW}']}
      - {fill: ['#reg-confirm', '{env:LP_TRAINEE_PW}']}
      - {click: '.v3-auth-card form button[type=submit]'}
      - {wait: '[data-testid=register-success]'}
    clip: .v3-auth-card
    margin: 40
    highlights:
      - {n: 1, box: '[data-testid=register-success] h2', badge: left}
      - {n: 2, box: '[data-testid=register-status]', badge: left}
      - {n: 3, box: '[data-testid=register-success] .v3-auth-submit', badge: left}

  - name: 15-roles-users-pending
    chapter: 10-prepare/30-roles
    status: keep
    account: admin
    path: /v3/users
    requires: ['user:trainee-xiaoming']
    wait: 'div.v3-alert'
    actions:
      - {click: 'div.v3-alert button'}
      - {sleep: 800}
    clip: main.v3-main div.v3-reveal
    margin: 16
    highlights:
      - {n: 1, box: 'div.v3-alert button', badge: right}
      - {box: '.v3-filters button >> nth=1'}
      - {n: 2, box: {zh: 'tr:has-text("trainee-xiaoming") button:has-text("通过")', en: 'tr:has-text("trainee-alex") button:has-text("Approve")'}, badge: top}

  - name: 15-roles-approve-dialog
    chapter: 10-prepare/30-roles
    status: keep
    account: admin
    path: /v3/users
    requires: ['user:trainee-xiaoming']
    wait: 'div.v3-alert'
    actions:
      - {click: {zh: 'tr:has-text("trainee-xiaoming") button:has-text("通过")', en: 'tr:has-text("trainee-alex") button:has-text("Approve")'}}
      - {wait: '[data-testid=v3-user-approve]'}
    clip: '[role=dialog]'
    margin: 40
    highlights:
      - {n: 1, box: '[data-testid=v3-user-approve] button', badge: left}
      - {n: 2, box: '[role=dialog] .v3-btn.primary', badge: top}

  - name: 15-roles-developer-sidebar
    chapter: 10-prepare/30-roles
    status: keep
    account: developer
    path: /v3
    viewport: [1440, 1100]
    storage: {launchpad_nav_mode: null}
    wait: '[data-testid=v3-shell]'
    actions: [{expand_rail: true}]
    clip: nav.v3-rail
    margin: 0
    highlights:
      - {n: 1, box: 'nav.v3-rail > a'}
      - {n: 2, box: '[data-tour=modules] .v3-rail-group'}
      - {n: 3, box: '[data-testid=v3-nav-mode]'}

  - name: 15-roles-bizowner-perms
    chapter: 10-prepare/30-roles
    status: keep
    account: admin
    path: /v3/users?view=detail&user=biz-owner
    requires: [user:biz-owner]
    wait: '.v3-usr-chip'
    clip: ['section.v3-panel:has(.v3-usr-chip)', 'section.v3-panel:has([data-testid=v3-user-granted])']
    highlights:
      - {n: 1, box: '.v3-usr-chip:has-text("criteria.sign")'}
      - {n: 2, box: '.v3-usr-chip:has-text("golden.admit")'}
      - {n: 3, box: '.v3-usr-chip:has-text("judge.calibrate")'}
      - {n: 4, box: '[data-testid=v3-user-granted] .v3-chip'}

  - name: 15-roles-user-sessions
    chapter: 10-prepare/30-roles
    status: new   # account detail: Force sign-out (revoke every session)
    account: admin
    path: /v3/users?view=detail&user=biz-owner
    requires: [user:biz-owner]
    wait: '.v3-usr-chip'
