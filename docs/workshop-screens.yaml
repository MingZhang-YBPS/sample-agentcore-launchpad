  - name: 40-teams-project-create
    chapter: 10-prepare/40-teams
    status: new   # New project dialog filled like retail-service; never submitted
    account: admin
    path: /v3/projects
    wait: '[data-testid=projects-table]'
    actions:
      - {click: {zh: 'button.v3-btn.primary:has-text("新建项目")', en: 'button.v3-btn.primary:has-text("New project")'}}
      - {wait: '[data-testid=project-create]'}
      - {fill: ['[data-testid=project-create] input.v3-input >> nth=0', '零售客服']}
      - {fill: ['[data-testid=project-create] input.v3-input.mono', 'retail-service']}
      - {eval: "(() => { const f=document.querySelector('[data-testid=project-create]'); const set=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set; const s=f.querySelectorAll('select'); set.call(s[0],'customer-care'); s[0].dispatchEvent(new Event('change',{bubbles:true})); setTimeout(()=>{ const s2=f.querySelectorAll('select'); set.call(s2[1],'retail'); s2[1].dispatchEvent(new Event('change',{bubbles:true})); },300); })()"}
      - {sleep: 800}
      - {fill: ['[data-testid=project-create] textarea', '零售与电商的智能客服，飞轮主线在这里']}
      - {click: '[data-testid=project-create] input[type=checkbox] >> nth=0'}
      - {sleep: 500}
    clip: .v3-modal
    margin: 40
    highlights:
      - {n: 1, box: '[data-testid=project-create] select >> nth=0', badge: left}
      - {n: 2, box: '[data-testid=project-create] select >> nth=1', badge: left}
      - {n: 3, box: '[data-testid=project-create] input[type=checkbox] >> nth=0', badge: left}

  - name: 40-teams-members
    chapter: 10-prepare/40-teams
